<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0f1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>MiBuscador</title>
</head>
<body>
    <div class="video-container">
        <img id="bgImage" src="PixelYelanLite.png" alt="Fondo">
        <img id="bgFade" class="bg-fade" src="" alt="">
        <div class="overlay"></div>
        <div class="content">
            <h1 class="logo">MiBuscador</h1>
            <p class="tagline">Busca lo que quieras</p>
            <form class="search-form" id="searchForm">
                <input type="text" id="searchInput" placeholder="Buscar en Google..." autocomplete="off" required>
                <button type="submit">Buscar</button>
            </form>
        </div>
    </div>

    <div class="shortcuts">
        <a href="https://www.youtube.com" target="_blank" class="shortcut">
            <div class="shortcut__icon">▶</div>
            <span>YouTube</span>
        </a>
        <a href="https://github.com" target="_blank" class="shortcut">
            <div class="shortcut__icon">⌨</div>
            <span>GitHub</span>
        </a>
        <a href="https://chat.openai.com" target="_blank" class="shortcut">
            <div class="shortcut__icon">✦</div>
            <span>ChatGPT</span>
        </a>
        <a href="https://twitter.com" target="_blank" class="shortcut">
            <div class="shortcut__icon">𝕏</div>
            <span>Twitter</span>
        </a>
    </div>

    <div class="toolbar">
        <button class="toolbar__btn" id="theme-toggle" aria-label="Cambiar tema">
            <span class="toolbar__icon">☀️</span>
            <span class="toolbar__tooltip">Tema</span>
        </button>
        <label class="toolbar__btn toolbar__btn--upload" for="bg-input" aria-label="Cambiar fondo">
            <span class="toolbar__icon">🖼</span>
            <span class="toolbar__tooltip">Cambiar fondo</span>
            <input type="file" id="bg-input" accept="image/*" hidden>
        </label>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('theme-toggle');
            const toggleIcon = toggle.querySelector('.toolbar__icon');
            const root = document.documentElement;
            const bgInput = document.getElementById('bg-input');
            const bgImage = document.getElementById('bgImage');
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');

            // Theme
            const savedTheme = localStorage.getItem('mi-buscador-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme) {
                root.setAttribute('data-theme', savedTheme);
            } else if (!systemDark) {
                root.setAttribute('data-theme', 'light');
            }
            
            toggleIcon.textContent = root.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
            
            toggle.addEventListener('click', () => {
                const current = root.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                localStorage.setItem('mi-buscador-theme', next);
                toggleIcon.textContent = next === 'dark' ? '☀️' : '🌙';
            });

            // Background
            const bgFade = document.getElementById('bgFade');
            const savedBg = localStorage.getItem('mi-buscador-bg');
            
            if (savedBg) {
                bgImage.src = savedBg;
            }
            
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        bgFade.src = ev.target.result;
                        bgFade.style.opacity = '1';
                        
                        setTimeout(() => {
                            bgImage.src = ev.target.result;
                            bgFade.style.opacity = '0';
                        }, 500);
                        
                        localStorage.setItem('mi-buscador-bg', ev.target.result);
                    };
                    reader.readAsDataURL(file);
                }
                bgInput.value = '';
            });

            // Search
            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const searchTerm = searchInput.value.trim();
                if (searchTerm !== '') {
                    window.open('https://www.google.com/search?q=' + encodeURIComponent(searchTerm), '_blank');
                    searchInput.value = '';
                }
            });
        });
    </script>
</body>
</html>
